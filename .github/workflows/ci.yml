name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          authToken: ${{ secrets.CACHIX_PUBLIC_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - name: Build and test
        run: nix --print-build-logs build --no-update-lock-file

  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.2/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          authToken: ${{ secrets.CACHIX_PUBLIC_TOKEN }}
          skipPush: ${{ github.event_name != 'push' }}
      - name: Check formatting
        run: nix develop --no-update-lock-file --command cargo fmt --all -- --check
      - name: Run Clippy
        run: nix develop --no-update-lock-file --command cargo clippy --locked --all-targets -- -D warnings
